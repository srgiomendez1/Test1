name: Actualizar CETES (Banxico) - Tauro pagos

on:
  schedule:
    # Todas las noches a las 8:00 pm hora del Centro (Chicago).
    # GitHub usa UTC: 01:00 UTC = 8 pm en horario de verano (CDT),
    # 02:00 UTC = 8 pm en horario de invierno (CST). El paso "guardia" deja correr solo la que cae a las 8 pm.
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # para volver a publicar GitHub Pages después de actualizar

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Guardia (solo 8 pm hora del Centro)
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # En horario de verano (CDT) vale la corrida de 01:00 UTC; en invierno (CST), la de 02:00 UTC.
          if [ "$(TZ=America/Chicago date +%Z)" = "CDT" ]; then WANT="0 1 * * *"; else WANT="0 2 * * *"; fi
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$SCHEDULE" = "$WANT" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No es la corrida de las 8 pm hora del Centro; se omite."
          fi
      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.guard.outputs.run == 'true'
        run: python tauro-pagos/scripts/update_cetes.py
      - if: steps.guard.outputs.run == 'true'
        name: Commit y volver a publicar si hay cambios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet tauro-pagos/data/cetes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add tauro-pagos/data/cetes.json
            git commit -m "chore: actualizar CETES $(date -u +%F)"
            git push
            gh workflow run pages.yml --ref "${GITHUB_REF_NAME}" || true
          fi
