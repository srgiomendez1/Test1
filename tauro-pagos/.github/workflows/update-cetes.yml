name: Actualizar CETES (Banxico)

on:
  schedule:
    # Miércoles y viernes 18:17 UTC (Banxico publica la subasta los martes)
    - cron: "17 18 * * 3,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_cetes.py
      - name: Commit si hay cambios
        run: |
          if ! git diff --quiet data/cetes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/cetes.json
            git commit -m "chore: actualizar CETES $(date -u +%F)"
            git push
          fi
